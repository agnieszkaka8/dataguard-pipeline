[project]
name = "dataguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "supabase>=2.25.1",
    "typer>=0.26.4",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[project.scripts]
dataguard = "dataguard.cli:app"

[tool.setuptools.packages.find]
include = ["dataguard*"]
